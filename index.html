<style>
:root{--bg:#070a12;--card:#0f1627;--ink:#e6eaf3;--mut:#8f9ab2;--line:#222c44;--nav:#04060b;--navt:#fff;--red:#c2b07a;--soft:#151e36;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#tw{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:6px}.toast{background:var(--red);color:#1c1808;padding:10px 14px;border-radius:4px;box-shadow:0 2px 8px #0005}

.tile{padding:16px 8px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center;line-height:1.5}.tile.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red)}.tile.lk{border-style:dashed;opacity:.6}
.bd{border:1px solid var(--line);background:var(--card)}.fr{display:grid;grid-template-columns:46px 1fr 1fr;border-top:1px solid var(--line)}.fr:first-child{border-top:0}.fn{display:grid;place-items:center;color:var(--mut);font-family:monospace}
.rm{background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border:0;border-left:1px solid var(--line);padding:14px 12px;line-height:1.5}.rm small{display:block;color:var(--mut);font-family:monospace;font-size:12px}.rm.lk{color:var(--mut);cursor:not-allowed}
.plan{position:relative;padding-bottom:66%;border:2px solid var(--line);background:radial-gradient(#1a2338,#0a0e18);margin:14px 0;border-radius:4px}.it{position:absolute;border:1.5px dashed var(--mut);background:#ffffff08;color:var(--mut);font:inherit;font-size:11px;line-height:1.2;padding:2px;cursor:pointer;display:grid;place-items:center;text-align:center;border-radius:3px}.it.sd{border-style:solid;border-color:var(--red);color:var(--red)}.ent{position:absolute;left:36%;bottom:2%;color:var(--red);font:10px monospace;border-bottom:2px solid var(--red)}
.sq span{display:inline-block;width:10px;height:10px;margin-left:4px;background:var(--line)}.sq .on{background:var(--red)}
img.av{object-fit:cover;object-position:50% 18%;filter:saturate(.55);background:#24345f}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.pt{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.pt.on{border-color:var(--red)}.pt img{width:34px;height:44px;object-fit:cover;object-position:50% 18%;filter:saturate(.55)}
.rec{border:1px solid var(--line);background:var(--card)}.rh{display:flex;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font:12px monospace;letter-spacing:.08em;color:var(--mut)}
.rp{display:flex;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.rp img{width:96px;height:124px;object-fit:cover;object-position:50% 15%;filter:saturate(.55)}.sub{font:12px monospace;color:var(--red);letter-spacing:.1em}
.rb{padding:16px}.qb{display:flex;gap:14px;width:100%;text-align:left;margin-top:10px;padding:14px;border:1px solid var(--mut);background:none;color:var(--ink);font:inherit;cursor:pointer}.qb span{color:var(--mut);font-family:monospace}.qb:disabled{opacity:.5;cursor:not-allowed;border-color:var(--line)}
.clk{color:var(--red);font:12px monospace;white-space:nowrap;align-self:center;padding:0 6px}
.doc{background:#e9e4d3;color:#2a2418;padding:14px;border-radius:2px}.doc h4{margin:0 0 8px;font-family:'Noto Serif KR',serif;text-align:center;border-bottom:1px solid #2a241855;padding-bottom:6px}.doc p{margin:0}.sg{text-align:right;margin-top:10px;font-size:13px}
.seal{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;border:2px solid #b3262f;color:#b3262f;border-radius:50%;font-size:11px;font-weight:700;transform:rotate(-12deg);margin-left:6px}
.gz{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}.bar{flex:1;height:8px;background:var(--line)}.bar i{display:block;height:100%;background:var(--red)}
.qb.nw{border-color:var(--red)}.ans.lie{border-left-color:var(--mut);opacity:.85}
.slot{padding:10px 12px;border:1px dashed var(--mut);margin:6px 0;border-radius:3px;cursor:pointer}.slot.ok{border-style:solid;border-color:var(--red);background:var(--soft)}
.news{background:#e9e4d3;color:#2a2418;padding:16px;border-radius:2px;margin-bottom:12px}.news .nh{font:12px monospace;border-bottom:2px solid #2a2418;padding-bottom:4px;margin-bottom:8px}.news h3{color:#2a2418}
.rm.lk{background:repeating-linear-gradient(45deg,transparent 0 6px,#ffffff08 6px 12px)}

.clk{flex:none}
.pls{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}.pola{margin:0;flex:1;max-width:260px;background:#ece6d4;padding:8px 8px 6px;box-shadow:0 3px 10px #0008}.pola img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 40%;filter:sepia(.2) saturate(.85)}.pola figcaption{color:#3a3326;font:600 13px 'Noto Serif KR',serif;text-align:center;padding:10px 2px 6px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 12px}.st{flex:none;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;text-align:center}.st.on{color:var(--ink)}.ring{display:block;width:58px;height:58px;border-radius:50%;padding:3px;border:2px solid var(--line);margin:0 auto 4px}.st.on .ring{border-color:var(--red)}.ring.ok{border-style:dashed}.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;filter:saturate(.55)}
.chat{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}.ch{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.ch img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 18%;filter:saturate(.55)}
.msgs{padding:14px;display:flex;flex-direction:column;gap:10px}.nar{text-align:center;color:var(--mut);font-size:12px}.bq{align-self:flex-end;max-width:84%;background:#24345f;color:#fff;padding:9px 13px;border-radius:14px 14px 2px 14px}.ba{align-self:flex-start;max-width:88%;background:var(--soft);padding:9px 13px;border-radius:14px 14px 14px 2px}.ba.lie{opacity:.7;font-style:italic}
.qr{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.qc{text-align:left;border:1px solid var(--mut);background:none;color:var(--ink);font:inherit;padding:9px 14px;border-radius:18px;cursor:pointer}.qc.nw{border-color:var(--red)}.qc:disabled{opacity:.5;cursor:not-allowed;border-color:var(--line)}
.og{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.oc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.oc .oi{font-size:26px}.oc small{color:var(--mut)}.oc.sd{border-color:var(--red);background:var(--soft)}
</style></head><body><header><b>LAST PAGE <small style="font-weight:400;color:#b9c3dc">CASE NO. 1028</small></b><span class="clk" id="clk"></span><nav id="nav"></nav></header><main id="m"></main><div id="tw"></div>
<script>
const P=[
{i:'박',n:'박성호',a:19,r:'디자인 담당',d:'현실적이고 세심하다. 시안 하나하나를 직접 챙기는 편이다.',q:[
['USB를 마지막으로 본 시간은 언제입니까?','18시 회의가 끝날 때까지 서랍에 있었습니다. 상혁이가 서랍을 잠그는 것도 확인했어요. 그 뒤로는 못 봤습니다.'],
['19시 20분에 김동현 씨와 언쟁을 하셨나요?','언쟁이요? 그런 일 없습니다. 저는 제 시안 작업을 일정대로 했을 뿐이에요.'],
['1년 전 6명이 함께한 회의록이 있습니다. 왜 숨기셨습니까?','…맞습니다. 그때 아이디어를 바탕으로 시안을 만들었는데, 제출할 때 팀원들 이름을 제대로 올리지 못했습니다. 디자인한 사람이 제 이름뿐이라 오해받을까 봐 말하지 못했어요. 하지만 USB를 가져갈 이유는 없습니다.',[4]]]},
{i:'이',n:'이상혁',a:19,r:'기획 담당',d:'침착하고 다정하다. 공과 사의 구분이 확실하다.',q:[
['학생회실은 언제 잠갔습니까?','20시 정각에 제가 잠그고 나왔습니다. 그때 서랍 안의 USB는 그대로였습니다.'],
['열쇠 관리 기록을 볼 수 있을까요?','여기 대장입니다. 서랍 열쇠 반출란이 빈 날이 있네요. 제가 열쇠 당번인데 꼼꼼히 못 챙긴 제 불찰입니다.',[],8],
['출입 기록을 미리 확인하신 적이 있습니까?','…20시 이후 기록 일부를 혼자 봤습니다. 공식 절차 없이 본 거라 말씀드리기 어려웠어요. 공과 사는 구분한다고 생각했는데, 열쇠 당번 책임을 추궁당할까 봐 숨겼습니다.',[1]]]},
{i:'명',n:'명재현',a:19,r:'학생회장',d:'자신감 있고 책임감이 강하다. 무엇이든 꼼꼼하게 확인한다.',q:[
['당일 동선을 말씀해 주세요.','18시 30분에 디자인 시안을 한 번 확인하고 바로 퇴근했습니다. 20시 30분엔 집이었어요.'],
['박성호 씨와 왜 갈등하셨습니까?','제작자 표기 때문입니다. 회장으로서 정리해야 했는데 쉽지 않았죠. 예전 회의록이 공유 폴더에 남아 있을 겁니다. 한번 보세요.',[],4],
['20시 30분 디자인 수정 기록은 무엇입니까?','저녁에 시안을 한 번 더 고친 건 사실입니다. 20시 30분은 원격 자동 동기화예요. 회장이 임의로 손댔다는 말이 나올까 봐 숨겼습니다.',[6]]]},
{i:'한',n:'한동민',a:18,r:'장비·전산 담당',d:'장난스럽고 자유분방하다. USB와 백업을 관리한다.',q:[
['USB는 언제 보셨나요?','19시쯤 한 번 확인했습니다. 별일 없었어요, 진짜로요.'],
['혹시 파일을 따로 복사해 두셨나요?','백업이요? 안 했습니다. 규정상 무단 백업은 금지잖아요.'],
['컴퓨터 기록에 19시 연결이 남아 있습니다.','…들켰네요. USB 오류가 떠서 개인 저장장치에 백업했습니다. 규정 위반으로 혼날까 봐 숨겼어요. 그 백업본이 여기 있습니다.',[2],7]]},
{i:'김',n:'김동현',a:18,r:'자료 조사 담당',d:'사교적이고 눈치가 빠르다.',q:[
['19시 20분에는 어디에 있었습니까?','자료 정리하면서 사진도 찍고 있었어요. 언쟁이요? 못 봤습니다.'],
['카메라 사진을 복구해 봐도 될까요?','…마음대로 하세요. 지운 건 없어요.',[],5],
['복구된 사진은 어떻게 설명하시겠습니까?','박성호 선배와 큰소리를 낸 건 맞습니다. 자료용 사진에 그 장면이 찍혔는데, 갈등이 밖에 알려질까 봐 지웠어요. USB와는 상관없습니다.',[5]]]},
{i:'운',n:'김운학',a:17,r:'홍보 담당',d:'목소리가 크고 분위기 메이커다. 섬세하게 사람들을 챙긴다.',q:[
['당일 언제 귀가했습니까?','19시 40분에 귀가했습니다! 홍보 포스터 마감하고 바로 갔어요. 그 뒤로는 집에 있었습니다.'],
['홍보 준비 중 과거 기록을 보신 적이 있나요?','홍보 문구 쓰려고 오래된 회의록을 뒤적이긴 했죠. 더 말씀드릴 건 없어요.'],
['20시 18분 출입 기록은 어떻게 설명하시겠습니까?','…맞아요, 들어갔어요. 성호 형이 기여도를 독점한 걸 알고 문제를 제기했는데 무시당했어요. 홍보로 기획안이 공개되기 전에 막으려던 거지, 부수거나 팔 생각은 없었습니다. 제 메모를 보세요.',[1],9]]}];
const C={1:['학생회실 출입 기록','20:18 김운학 카드 입실, 20:26 퇴실. “19:40 귀가” 진술과 모순된다.'],
2:['컴퓨터 사용 기록','20:19 외장 저장장치 연결, 20:23 최종 기획안 폴더 열람.'],
3:['USB 장치 식별 기록','20:19에 연결된 장치의 일련번호가 도난된 원본 USB와 일치한다.'],
4:['오래된 프로젝트 회의록','1년 전 6명이 함께 ‘우리의 교정’을 논의한 회의록. 참석자 6명 전원.'],
5:['복구된 삭제 사진','19:20 박성호와 김동현이 언쟁하는 장면.'],
6:['디자인 수정 기록','20:30 기록에 “원격 자동 동기화”라고 명시. 실제 입실이 아니다.'],
7:['한동민의 백업 파일','19:00 생성된 백업본. 도난 사건과는 무관하다.'],

function ivNew(){const i=S.w,p=P[i],cnt=k=>P[k].q.filter((_,j)=>S.a[k+'_'+j]).length,c=cnt(i),tot=P.reduce((s,_,k)=>s+cnt(k),0),w=wz(i),mood=w<35?'😌 편안한 상태':w<60?'😒 경계하는 중':'😠 마음을 닫음';
const asked=p.q.map((q,j)=>S.a[i+'_'+j]?`<div class="bq">${q[0]}</div><div class="ba" ${tw==i+'_'+j?'id="twx"':''}><span class="a">${j==2?PF[i]:''}${q[1]}</span></div>`:'').join('');
const lies=p.q.map((q,j)=>{const k=i+'_'+j;return !S.a[k]&&has(q[2]||[])&&S.nz&&S.nz[k]?`<div class="bq">${q[0]}</div><div class="ba lie">${LIE[i]}</div>`:''}).join('');
const qs=p.q.map((q,j)=>{const k=i+'_'+j,nz=S.nz&&S.nz[k],nd=(q[2]||[]).length;return S.a[k]?'':has(q[2]||[])?`<button class="qc ${nd?'nw':''}" onclick="ask(${i},${j})">${nd?'🔓 ':''}${nz?'다시 묻기 — ':''}${q[0]}</button>`:`<button class="qc" disabled>🔒 잠긴 질문</button>`}).join('');
return `<h2>인물 조사</h2><div class="stories">${P.map((x,k)=>`<button class="st ${k==i?'on':''}" onclick="go('iv',${k})"><span class="ring ${done(k)?'ok':''}"><img src="${PH[k]}" alt=""></span>${x.n}</button>`).join('')}</div><div class="chat"><div class="ch"><img src="${PH[i]}" alt=""><div style="flex:1"><b>${p.n}</b> <span class="mut">${p.a}세 · ${p.r}</span><div class="mut" style="font-size:12px">${mood}</div><div class="bar" style="margin-top:4px"><i style="width:${w}%"></i></div></div><button class="btn ghost" onclick="vent(${i})">☕ 분위기 풀기</button></div><div class="msgs"><div class="nar">${p.d}</div>${asked+lies||'<div class="nar">아직 대화를 나누지 않았습니다.</div>'}</div><div class="qr">${qs||'<div class="nar">이 인물에게 할 질문을 모두 마쳤습니다.</div>'}</div></div><p class="mut">진술 확보 ${tot} / 18 · 이 인물 ${c} / 3</p>`}

home:()=>`<div class="hero"><span class="stamp">CASE FILE · 한도고등학교 · 10월 28일</span><h1>LAST PAGE</h1><h3>사라진 원본 USB</h3><p>축제 개막 하루 전, 학생회실에서 최종 기획안 USB가 사라졌다.<br>내일 오전 10시까지 찾지 못하면 프로젝트는 취소된다.</p><button class="btn red" onclick="go('case')">수사 시작</button></div><p class="mut" style="text-align:center">플레이 시간 10~20분 · 진행은 자동 저장됩니다 · <a href="#" onclick="reset();return false" style="color:inherit">처음부터 다시 하기</a></p>`,
case:()=>`<div class="card"><h2>사건 개요</h2><div><div class="pls"><figure class="pola" style="transform:rotate(-3deg)"><img src="${PL[0]}" alt=""><figcaption>학생회 무대</figcaption></figure><figure class="pola" style="transform:rotate(2.5deg)"><img src="${PL[1]}" alt=""><figcaption>학생회 첫날 단체샷</figcaption></figure></div><div class="doc"><h4>[긴급 공지] 학생회실 USB 분실</h4><p>금일 21:00경 학생회실에 보관 중이던 특별 전시 ‘우리의 교정’ 최종 기획안 원본 USB가 분실되었습니다. 내일 오전 10시까지 원본을 찾지 못하면 전시는 취소됩니다. 조사 담당자는 오늘 자정(24:00)까지 결과를 제출하십시오.</p><div class="sg">한도고등학교 학생지도부 <span class="seal">직인</span></div></div></div><div class="ans"><b>⏱ 데드라인 24:00</b> — 오늘 밤 12시까지 진실을 밝혀내야 한다. 조사, 질문, 연결을 할 때마다 시간이 흐른다. 현재 ${clk()}</div><p><b>장소</b> 한도고등학교 학생회실<br><b>날짜</b> 10월 28일 밤<br><b>피해</b> 최종 기획안 원본 USB 분실. 문은 잠겨 있었고 서랍에 파손 흔적은 없다.<br><b>용의자</b> 출입 권한자 6명, 전원 마지막 목격 시간이 서로 다르다.<br><b>목표</b> 범인, 범행 동기, 사건의 진짜 배경을 밝혀라.</p><button class="btn red" onclick="go('map')">약도 열기</button></div><div class="card"><h3>수사 점수</h3><p>100점에서 시작해 최종 등급이 정해집니다.<br>· 힌트는 최대 5번, 3번까지는 감점 없음. 4·5번째 힌트는 각 −10점<br>· 잘못된 증거 연결 −1점<br>· 잘못된 타임라인 배치, 암호 해독 실패 −2점<br>· 등급 S 90점 이상 / A 75점 이상 / B 55점 이상 / C 그 미만<br>현재 점수 ${Math.max(0,100-pen())}점 (수사 노트에서도 확인)</p></div>`,
map:()=>S.rm&&lo(S.rm)?room():plan(),
mapOld:()=>{const L=[['room','학생회실','🏛️'],['it','전산실','🖥️'],['design','디자인실','🎨'],['lock','사물함 복도','🗄️']],cur=lo(S.loc||'room')?(S.loc||'room'):'room',nm=L.find(x=>x[0]==cur)[1];return `<h2>한도고등학교 약도</h2><div class="card"><div class="map">${L.map(([k,t,i])=>{const ids=Object.keys(SPL).filter(x=>SPL[x]==k),f=ids.filter(x=>S.c.includes(+x)).length;return `<button class="tile ${cur==k?'on':''} ${lo(k)?'':'lk'}" onclick="loc('${k}')"><span style="font-size:26px">${lo(k)?i:'🔒'}</span><br><b>${t}</b><br><span class="mut">${lo(k)?f+'/'+ids.length+' 발견':'잠김'}</span></button>`}).join('')}</div></div><div class="card"><h3>${nm} 조사</h3>${SP.filter(s=>SPL[s[0]]==cur).map(([id,t,n])=>{const f=S.c.includes(id),o=has(n);return `<button class="q" ${f||!o?'disabled':''} onclick="spot(${id})">${f?'✔ ':o?'':'🔒 '}${t}</button>`}).join('')}</div><div class="card"><button class="btn ghost" ${(S.h||0)>=5?'disabled':''} onclick="hint()">💡 힌트 보기 (${S.h||0}/5 · ${(S.h||0)<3?'무료':'−10점'})</button>${hn?`<div class="ans">${hn}</div>`:''}</div>`},
sus:()=>`<h2>용의자 목록</h2><div class="grid">${P.map((p,i)=>`<div class="card"><div class="row"><img class="av" src="${PH[i]}" alt=""><div><b>${p.n}</b> (${p.a}세)<br><span class="mut">${p.r}</span></div></div><p>${p.d}</p><span class="badge ${done(i)?'ok':''}">${done(i)?'조사 완료':'조사 '+P[i].q.filter((_,j)=>S.a[i+'_'+j]).length+'/3'}</span> <button class="btn" onclick="go('iv',${i})">인터뷰</button></div>`).join('')}</div>`,
iv:()=>ivNew(),
ivOld:()=>{const i=S.w,p=P[i];return `<div class="card"><div class="row"><div class="av">${p.i}</div><div><h3 style="margin:0">${p.n} · ${p.r}</h3><span class="mut">${p.a}세</span></div></div></div><div class="card">${p.q.map((q,j)=>{const a=S.a[i+'_'+j],o=has(q[2]||[]);return `<button class="q ${o?'':'lock'}" ${a||!o?'disabled':''} onclick="ask(${i},${j})">${o?'':'🔒 '}${q[0]}</button>${a?`<div class="ans">${q[1]}</div>`:''}`}).join('')}</div><div class="flow"><button class="btn ghost" onclick="go('iv',(S.w+5)%6)">◀ 이전 인물</button><button class="btn ghost" onclick="go('iv',(S.w+1)%6)">다음 인물 ▶</button></div>`},
ev:()=>`<h2>증거 보관함 <span class="badge">${S.c.length}/12</span></h2><div class="grid">${Object.keys(C).map(k=>{const f=S.c.includes(+k);return `<div class="card ${f?'':'lock'}">${f?ph(k):''}<b>${f?C[k][0]:'🔒 미발견 단서'}</b>${f&&S.sc.includes(+k)?' <span class="badge ok">📌 스크랩됨</span>':''}<p class="mut">${f?C[k][1].slice(0,38)+'…':'잠겨 있습니다.'}</p>${f?`<button class="btn ghost" onclick="clue(${k})">상세·스크랩</button>`:''}</div>`}).join('')}</div>`,
tl:()=>tlNew(),
tlOld:()=>`<h2>사건 타임라인</h2><div class="card"><div class="tl">${T.map(([t,e,n])=>{const o=has(n);return `<div class="${o?'':'lk'}"><b>${t}</b> ${o?e:'<span class=mut>???</span>'}${t=='19:40'&&S.a['5_0']?'':''}${o&&t=='19:40'&&S.c.includes(1)?'<br><span class="warn">20:18 출입 기록과 모순</span>':''}</div>`}).join('')}</div></div><div class="card"><h3>인물별 진술</h3>${P.map((p,i)=>`<p><b>${p.n}</b> ${S.a[i+'_0']?p.q[0][1]:'<span class=mut>미청취</span>'}</p>`).join('')}</div>`,
cn:()=>`<h2>증거 연결</h2>${S.fz?'<p class="mut">🔒 열람 전용입니다.</p>':''}${board()}<div class="card"><p>단서 2개를 골라 관계를 확인하세요.</p>${S.c.length?S.c.map(k=>`<button class="chip ${sel.includes(k)?'on':''}" ${S.fz?'disabled':''} onclick="pick(${k})">${C[k][0]}</button>`).join(''):'<p class="mut">먼저 단서를 모으세요.</p>'}<p><button class="btn red" ${sel.length==2&&!S.fz?'':'disabled'} onclick="link()">연결하기</button></p>${rs}</div><div class="card"><h3>연결 성공 기록 (${S.cn.length}/${Object.keys(CB).length})</h3>${S.cn.map(k=>`<p><b>${k.split('-').map(x=>C[x][0]).join(' + ')}</b><br>${CB[k]}</p>`).join('')||'<p class="mut">아직 없습니다.</p>'}</div>`,
nt:()=>{const ans=i=>P[i].q.map((q,j)=>S.a[i+'_'+j]?`<p><span class="mut">Q. ${q[0]}</span><br>${q[1]}</p>`:'').join('')||'<p class="mut">청취한 진술 없음</p>';return `<h2>수사 노트</h2>${S.fz?'<p class="mut">🔒 열람 전용입니다.</p>':''}<div class="card"><h3>스크랩한 단서</h3>${S.sc.map(k=>`<p><b>${C[k][0]}</b> — ${C[k][1]} ${S.fz?'':`<a href="#" onclick="scrap(${k});return false" class="warn">삭제</a>`}</p>`).join('')||'<p class="mut">증거 상세에서 스크랩하세요.</p>'}</div><div class="card"><h3>수사 평가</h3><p>현재 ${Math.max(0,100-pen())}점 · 힌트 ${S.h||0}/5 (4번째부터 −10) · 잘못된 연결 ${S.wl||0}회 (−1) · 잘못된 배치·해독 ${S.wt||0}회 (−2)</p></div><div class="card"><h3>진술 비교기</h3><div class="cols">${[0,1].map(s=>`<div><select onchange="cmp[${s}]=+this.value;R()">${P.map((p,i)=>`<option value="${i}" ${cmp[s]==i?'selected':''}>${p.n}</option>`).join('')}</select>${ans(cmp[s])}</div>`).join('')}</div></div><div class="card"><h3>추리 메모</h3><textarea id="mm" rows="7" placeholder="가설과 의심 가는 점을 적어 보세요" ${S.fz?'readonly':''} oninput="memo(this.value)">${S.memo}</textarea></div>`},
fin:()=>{const g=(k,t,a)=>`<div class="card"><h3>${t}</h3>${a.map((x,i)=>`<label class="o"><input type="radio" name="${k}" ${S.f[k]===i?'checked':''} onchange="fin('${k}',${i})"> ${x}</label>`).join('')}</div>`;return `<h2>최종 추리</h2>${g('c','1. 범인은 누구인가?',P.map(p=>p.n))}${g('m','2. 범행 동기는 무엇인가?',M)}${g('b','3. 사건의 진짜 배경은?',B)}<button class="btn red" ${[0,1,2].every((_,x)=>S.f['cmb'[x]]!=null)?'':'disabled'} onclick="submit()">추리 제출</button>`},
end:()=>{const e=S.end,sc=Math.max(0,100-pen()),rk=sc>=90?'S':sc>=75?'A':sc>=55?'B':'C',nm=P[S.f.c]?P[S.f.c].n:'',H={perfect:['TRUE ENDING · 완벽한 정답','범인, 동기, 배경까지 모두 밝혀내 사건을 완전히 종결했습니다.'],part:['NORMAL ENDING · 부분 정답','진범은 잡았지만 진실의 일부는 끝내 묻혔습니다.'],wrong:['BAD ENDING · 오답','수사는 엉뚱한 곳에서 끝났습니다.']}[e]||['',''];
const B={perfect:`<div class="card"><h3>밝혀진 진실</h3><p><b>범인은 김운학.</b> 20:18에 입실해 USB를 가져갔다. 판매나 파괴가 목적이 아니었다. 그는 6명이 함께 만든 프로젝트의 기여가 박성호 한 사람에게 모인 것을 알았고, 문제 제기가 무시되자, 홍보 담당으로서 기획안이 공개되기 전에 막으려 했다.</p><p>반전은 LAST_PAGE에 있었다. 그 문서에는 6명 전원이 공동 제작자라는 합의가 있었고, 박성호의 서명도 있었다. 그는 기여를 지우려던 것이 아니라 말할 용기를 내지 못했던 것이다. 운학은 USB를 돌려주었고, 6명은 이름을 함께 올려 기획안을 제출하기로 했다.</p></div><div class="card"><h3>거짓말의 이유</h3><p><b>박성호</b> 남의 공을 가로챘다는 오해가 두려워 과거 프로젝트를 숨겼다.<br><b>이상혁</b> 열쇠 당번으로서 책임을 추궁당할까 봐 출입 기록 확인을 알리지 않았다.<br><b>명재현</b> 회장이 시안을 임의로 고쳤다는 말이 나올까 봐 숨겼다.<br><b>한동민</b> 무단 백업 규정 위반이 걱정됐다.<br><b>김동현</b> 언쟁이 밖에 알려지는 것을 막으려 사진을 지웠다.<br><b>김운학</b> 귀가했다고 거짓 진술해 입실을 감췄다.</p></div><div class="news"><div class="nh">한도고 신문 · 후일담</div><h3>‘우리의 교정’ 6인 공동 제작으로 정정… USB 분실 사건 마무리</h3><p>학생회실 USB 분실 사건이 합의 문서로 마무리됐다. 김운학 군은 무단 반출을 인정해 교내 봉사 3일의 경징계를 받았다. 박성호 군은 공모전 제출 명의를 6인 공동으로 정정하고 서면 사과했다. 한동민 군(무단 백업)과 이상혁 군(출입 기록 미보고)은 구두 경고를, 학생회장 명재현 군은 시안 임의 수정으로 주의를 받았고, 김동현 군은 사안과 무관한 것으로 결론 났다. 전시는 여섯 사람의 이름을 나란히 걸고 개막했다.</p></div>`,
part:`<div class="card"><h3>남은 앙금</h3><p>김운학이 USB를 가져간 사실은 밝혀졌다. 하지만 왜 그랬는지는 ‘단순한 탈취’로 처리됐고, USB 속 LAST_PAGE에 담긴 6명의 합의는 아무도 열어 보지 않은 채 묻혔다.</p><p>운학은 해명할 기회를 얻지 못했고, 박성호는 끝내 과거 프로젝트에 대해 입을 열지 않았다. 여섯 사람 사이의 어색함은 그대로 남았다.</p></div><div class="news"><div class="nh">한도고 신문 · 후일담</div><h3>USB 분실 사건 종결… “왜”는 남았다</h3><p>학교는 김운학 군에게 근신 1주 처분을 내렸다. 전시는 박성호 군 단독 명의로 개막했으나, 공동 제작 논란은 학생회 안에서 이어지고 있다. 김운학 군은 학생회를 탈퇴했고, 일부 학생들은 재조사를 요구하는 서명을 모으고 있다.</p></div>`,
wrong:`<div class="card"><h3>종결된 수사</h3><p>당신은 ${nm}을(를) 범인으로 지목했다. 그러나 그는 USB를 가져가지 않았다. 학교는 사건을 ‘분실’로 마무리하고 조사를 강제 종료했다. 진범은 끝내 입을 열지 않았고, USB의 행방도 밝혀지지 않았다.</p></div><div class="news"><div class="nh">한도고 신문 · 후일담</div><h3>‘USB 분실’ 오인 지목 논란… 학교, 조사 강제 종료</h3><p>${nm} 군은 무혐의로 확인됐지만 한동안 학생들의 의심을 받아야 했다. 학교는 징계 심의 없이 사건을 분실 처리했으나, ‘우리의 교정’ 전시는 끝내 개막하지 못하고 취소됐다. 진범은 끝내 드러나지 않았다.</p></div>`}[e]||'';
return `<div class="hero"><span class="stamp">${H[0]}</span><p>${H[1]}</p></div>${B}<div class="card"><h3>수사 평가 ${rk}</h3><p>${sc}점 · 힌트 ${S.h||0}회 · 잘못된 연결 ${S.wl||0}회 · 잘못된 배치·해독 ${S.wt||0}회 · 종료 ${clk()}</p></div><div class="card" style="text-align:center"><button class="btn red" onclick="reset(1)">처음부터 다시 하기</button></div>`}};
const N=[['home','처음'],['case','사건 개요'],['map','약도'],['sus','용의자'],['iv','인터뷰'],['ev','증거'],['tl','타임라인'],['cn','연결'],['nt','수사 노트'],['fin','최종 추리']];
function R(){$('#clk').textContent='⏱ '+clk();if(S.to&&!S.end&&['home','case','map','sus','iv'].includes(S.pg))S.pg='fin';$('#nav').innerHTML=N.map(([k,t])=>`<button class="${S.pg==k?'on':''}" onclick="go('${k}')">${lk(k)?'🔒 ':''}${t}</button>`).join('')+'<button onclick="go(&quot;nt&quot;)">탐정 수첩 '+S.sc.length+'</button><button onclick="reset()">처음부터</button>';const k=N.findIndex(x=>x[0]==S.pg),pv=N[k-1],nx=N[k+1];$('#m').innerHTML=`<div class="mut">${CH[S.pg]||''}</div>`+V[S.pg]()+(k<1?'':`<div class="flow">${pv?`<button class="btn ghost" onclick="go('${pv[0]}')">◀ ${pv[1]}</button>`:'<span></span>'}${nx?`<button class="btn red" ${lk(nx[0])?'disabled':''} onclick="go('${nx[0]}')">${lk(nx[0])?'🔒 ':''}다음: ${nx[1]} ▶</button>`:''}</div>`);}
R();
</script></body></html>
